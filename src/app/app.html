<app-grain-overlay />
<app-topbar />

<div
  class="app-content"
  [attr.inert]="modalOpen() ? '' : null"
  [attr.aria-hidden]="modalOpen() ? 'true' : null"
>
  <main>
    @if (store.role() === 'admin') {
      <section id="view-admin" class="view enter view-admin">
        <app-admin-view />
      </section>
    } @else {
      <section id="view-provider" class="view enter view-provider">
        <app-provider-view />
      </section>
    }
  </main>

  <footer>
    PASE · SISTEMA DE GESTIÓN DE INVITADOS Y ACCESOS — LOS DATOS DE ESTA DEMO VIVEN ÚNICAMENTE EN TU
    NAVEGADOR
  </footer>
</div>

<app-toast-host />
<app-modal-outlet />
